<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مصنع البرومبتات بـ Gemini</title>
<style>
:root{--bg:#0b0d14;--card:#151826;--line:#262b40;--tx:#e9ecf5;--mut:#8b92ab;--ac:#7c5cff;--ac2:#22d3ee;--bad:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;background:radial-gradient(900px 500px at 80% -10%,#2a1f6b55,transparent),var(--bg);color:var(--tx);min-height:100vh;padding:24px 16px}
.wrap{max-width:760px;margin:auto}
h1{font-size:28px;margin:0 0 6px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--mut);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
label,.lbl{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
textarea,select,input{width:100%;background:#0e1120;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:12px;font:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.count{font-size:12px;color:var(--mut);text-align:left;margin-top:4px}
.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--ac),#5b8cff)}
button.ghost{background:#222742}
button.small{padding:6px 12px;font-size:13px}
button.danger{background:#3a1f2b;color:#ffb4b4}
button:disabled{opacity:.6;cursor:not-allowed}
#out{white-space:pre-wrap;line-height:1.8;background:#0e1120;border:1px dashed var(--line);border-radius:10px;padding:14px;min-height:80px}
#out.err{color:var(--bad);border-color:var(--bad)}
#out.loading{color:var(--mut);display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--ac2);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
code{direction:ltr;display:block;background:#0e1120;padding:10px;border-radius:8px;overflow-x:auto;font-size:13px;color:var(--ac2)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.head .lbl{margin:0}
.hist-item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:#0e1120}
.hist-meta{font-size:12px;color:var(--mut);margin-bottom:6px}
.hist-idea{font-weight:600;margin-bottom:4px;word-break:break-word}
.hist-prompt{color:var(--mut);font-size:13px;max-height:3.2em;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.hist-actions{display:flex;gap:8px;margin-top:8px}
.empty{color:var(--mut);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>مصنع البرومبتات ✨</h1>
  <p class="sub">اكتب فكرتك واختار المنصة، وGemini يطلعلك برومبت احترافي.</p>

  <div class="card">
    <label for="idea">فكرتك</label>
    <textarea id="idea" maxlength="4000" placeholder="مثال: لوجو لمطعم برجر بطابع كرتوني بحري"></textarea>
    <div class="count"><span id="cnt">0</span> / 4000</div>
    <div class="row">
      <div><label for="platform">المنصة</label>
        <select id="platform">
          <option>ChatGPT / نص</option><option>Claude</option><option>Gemini</option>
          <option>Midjourney / صور</option><option>فيديو (Sora / Veo / Runway)</option>
          <option>كود</option><option>موسيقى / صوت</option><option>مواقع (AI website builder)</option>
        </select></div>
      <div><label for="tone">الأسلوب</label>
        <select id="tone"><option>احترافي</option><option>إبداعي</option><option>مختصر</option><option>تفصيلي جداً</option></select></div>
      <div><label for="lang">لغة البرومبت</label>
        <select id="lang"><option>عربي</option><option>English</option></select></div>
    </div>
    <div class="actions">
      <button id="go">ولّد البرومبت</button>
    </div>
  </div>

  <div class="card">
    <div class="lbl">النتيجة</div>
    <div id="out" aria-live="polite">هيظهر البرومبت هنا…</div>
    <div class="actions">
      <button id="copy" class="ghost" disabled>نسخ</button>
      <button id="improve" class="ghost" disabled>حسّن البرومبت ✨</button>
    </div>
  </div>

  <div class="card">
    <div class="head">
      <div class="lbl">آخر البرومبتات (آخر 20)</div>
      <button id="clearAll" class="small danger" style="display:none">مسح الكل</button>
    </div>
    <div id="hist"></div>
  </div>

  <div class="card">
    <div class="lbl">رابط الـ MCP بتاع الموقع (ضيفه في Claude / Cursor)</div>
    <code id="mcpUrl"></code>
  </div>
</div>

<script>
// ===== الإعدادات =====
const SUPABASE_URL = "https://cijujqhxdjpvuyzbxedf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpanVqcWh4ZGpwdnV5emJ4ZWRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTU3NjgsImV4cCI6MjEwODI5MTc2OH0.GEF6l_B-6xPfcoct2qE_tU_v4n4vpHtdSWyGDioc4CE"; // anon key بس (عام ومسموح)، مش مفتاح Gemini
const MAX_IDEA = 4000;
const HIST_KEY = "promptfactory_history_v1";
const HIST_MAX = 20;
const TIMEOUT_MS = 45000;
// =====================

const $ = id => document.getElementById(id);
$("mcpUrl").textContent = SUPABASE_URL + "/functions/v1/mcp";

let lastResult = null; // { idea, platform, tone, lang, prompt }
let busy = false;

/* ---------- localStorage (آمن) ---------- */
function loadHist() {
  try { const a = JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); return Array.isArray(a) ? a : []; }
  catch { return []; }
}
function saveHist(a) { try { localStorage.setItem(HIST_KEY, JSON.stringify(a.slice(0, HIST_MAX))); } catch {} }

function addHist(item) {
  const a = loadHist();
  a.unshift({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), at: Date.now(), ...item });
  saveHist(a);
  renderHist();
}
function delHist(id) { saveHist(loadHist().filter(x => x.id !== id)); renderHist(); }

function renderHist() {
  const box = $("hist"); const a = loadHist();
  box.textContent = "";
  $("clearAll").style.display = a.length ? "" : "none";
  if (!a.length) { const p = document.createElement("div"); p.className = "empty"; p.textContent = "لسه مفيش برومبتات محفوظة."; box.appendChild(p); return; }
  for (const it of a) {
    const d = document.createElement("div"); d.className = "hist-item";
    const meta = document.createElement("div"); meta.className = "hist-meta";
    meta.textContent = `${it.platform || ""} · ${it.tone || ""} · ${new Date(it.at).toLocaleString("ar-EG")}`;
    const idea = document.createElement("div"); idea.className = "hist-idea";
    idea.textContent = (it.idea || "").slice(0, 120) + ((it.idea || "").length > 120 ? "…" : "");
    const pr = document.createElement("div"); pr.className = "hist-prompt"; pr.textContent = it.prompt || "";
    const acts = document.createElement("div"); acts.className = "hist-actions";
    const reuse = document.createElement("button"); reuse.className = "small ghost"; reuse.textContent = "إعادة استخدام";
    reuse.onclick = () => reuseItem(it);
    const del = document.createElement("button"); del.className = "small danger"; del.textContent = "حذف";
    del.onclick = () => delHist(it.id);
    acts.append(reuse, del);
    d.append(meta, idea, pr, acts);
    box.appendChild(d);
  }
}

function reuseItem(it) {
  $("idea").value = it.idea || ""; updateCount();
  if (it.platform) $("platform").value = it.platform;
  if (it.tone) $("tone").value = it.tone;
  if (it.lang) $("lang").value = it.lang;
  lastResult = it;
  showResult(it.prompt || "");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("clearAll").onclick = () => { if (confirm("تمسح كل السجل؟")) { saveHist([]); renderHist(); } };

/* ---------- واجهة ---------- */
function updateCount() { $("cnt").textContent = $("idea").value.length; }
$("idea").addEventListener("input", updateCount);

function setBusy(on, label) {
  busy = on;
  $("go").disabled = on;
  $("improve").disabled = on || !lastResult;
  $("copy").disabled = on || !lastResult;
  $("go").textContent = on && label === "go" ? "جاري التوليد…" : "ولّد البرومبت";
  $("improve").textContent = on && label === "improve" ? "جاري التحسين…" : "حسّن البرومبت ✨";
}
function showLoading(msg) {
  const o = $("out"); o.className = "loading"; o.textContent = "";
  const s = document.createElement("span"); s.className = "spin";
  const t = document.createElement("span"); t.textContent = msg;
  o.append(s, t);
}
function showError(msg) { const o = $("out"); o.className = "err"; o.textContent = msg; }
function showResult(txt) { const o = $("out"); o.className = ""; o.textContent = txt; $("copy").disabled = false; $("improve").disabled = false; }

function errorMessage(status, serverMsg) {
  if (serverMsg) return serverMsg;
  if (status === 401 || status === 403) return "مفيش صلاحية للوصول. اتأكد من مفتاح الموقع.";
  if (status === 413) return "الفكرة طويلة أوي. قصّرها شوية.";
  if (status === 429) return "طلبات كتير. استنى شوية وجرّب تاني.";
  if (status >= 500) return "السيرفر مشغول أو فيه مشكلة. جرّب بعد شوية.";
  return "حصل خطأ غير متوقع. جرّب تاني.";
}

async function callApi(payload) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const r = await fetch(SUPABASE_URL + "/functions/v1/generate-prompt", {
      method: "POST", signal: ctrl.signal,
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify(payload)
    });
    let d = null;
    try { d = await r.json(); } catch {}
    if (!r.ok) throw new Error(errorMessage(r.status, d && d.error));
    if (!d || !d.prompt) throw new Error("الرد جه فاضي. جرّب تاني.");
    return d.prompt;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("الطلب أخد وقت طويل. جرّب تاني.");
    if (e instanceof TypeError) throw new Error("مفيش اتصال بالإنترنت أو السيرفر مش بيرد.");
    throw e;
  } finally { clearTimeout(timer); }
}

async function run(idea, label) {
  if (busy) return;
  const meta = { platform: $("platform").value, tone: $("tone").value, lang: $("lang").value };
  setBusy(true, label);
  showLoading(label === "improve" ? "جاري تحسين البرومبت…" : "جاري توليد البرومبت…");
  try {
    const prompt = await callApi({ idea, platform: meta.platform, tone: meta.tone, language: meta.lang });
    const origIdea = label === "improve" && lastResult ? lastResult.idea : idea;
    lastResult = { idea: origIdea, ...meta, prompt };
    showResult(prompt);
    addHist(lastResult);
  } catch (e) {
    showError(e.message || "حصل خطأ. جرّب تاني.");
  } finally { setBusy(false); }
}

$("go").onclick = () => {
  const idea = $("idea").value.trim();
  if (!idea) { showError("اكتب فكرتك الأول."); return; }
  run(idea.slice(0, MAX_IDEA), "go");
};

$("improve").onclick = () => {
  if (!lastResult || !lastResult.prompt) return;
  const prefix = "حسّن البرومبت ده وخليه أدق وأقوى وأوضح، وحافظ على نفس الهدف:\n\n";
  run((prefix + lastResult.prompt).slice(0, MAX_IDEA), "improve");
};

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("out").textContent); $("copy").textContent = "تم ✓"; }
  catch { $("copy").textContent = "انسخ يدوي"; }
  setTimeout(() => $("copy").textContent = "نسخ", 1500);
};

updateCount();
renderHist();
</script>
</body>
</html>
